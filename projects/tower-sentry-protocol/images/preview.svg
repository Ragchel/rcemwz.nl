<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="A tower silhouette at the center of glowing concentric orbit rings, with small orbs and mines in orbit">
    <title>Sentry Protocol orbit plotter</title>
    <defs>
        <linearGradient id="tspSky" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#241726"/>
            <stop offset="55%" stop-color="#33202b"/>
            <stop offset="100%" stop-color="#1c1420"/>
        </linearGradient>
        <radialGradient id="tspFieldGlow" cx="50%" cy="58%" r="55%">
            <stop offset="0%" stop-color="#dd8297" stop-opacity="0.30"/>
            <stop offset="100%" stop-color="#dd8297" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="tspTower" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fff6da"/>
            <stop offset="45%" stop-color="#e8c98f"/>
            <stop offset="100%" stop-color="#8a6a4a"/>
        </linearGradient>
        <radialGradient id="tspTowerGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff2d0" stop-opacity="0.9"/>
            <stop offset="45%" stop-color="#f3c98a" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#f3c98a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="tspOrbPink" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffe3ea"/>
            <stop offset="100%" stop-color="#dd8297"/>
        </radialGradient>
        <radialGradient id="tspOrbGreen" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#e6f0df"/>
            <stop offset="100%" stop-color="#71816b"/>
        </radialGradient>
        <radialGradient id="tspVignette" cx="50%" cy="46%" r="72%">
            <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
        </radialGradient>
        <filter id="tspSoft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="9"/>
        </filter>
        <filter id="tspSofter" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.5"/>
        </filter>
    </defs>

    <rect width="960" height="600" fill="url(#tspSky)"/>

    <g opacity="0.5">
        <circle cx="120" cy="110" r="1.6" fill="#fff6da"/>
        <circle cx="205" cy="65" r="1.1" fill="#fff6da"/>
        <circle cx="75" cy="250" r="1.3" fill="#fff6da"/>
        <circle cx="855" cy="95" r="1.4" fill="#fff6da"/>
        <circle cx="900" cy="185" r="1" fill="#fff6da"/>
        <circle cx="795" cy="120" r="1.3" fill="#fff6da"/>
        <circle cx="60" cy="160" r="1.2" fill="#fff6da"/>
    </g>

    <circle cx="480" cy="360" r="260" fill="url(#tspFieldGlow)"/>

    <g fill="none" stroke="#e8c98f">
        <circle cx="480" cy="360" r="120" stroke-opacity="0.5" stroke-width="1.4"/>
        <circle cx="480" cy="360" r="168" stroke-opacity="0.35" stroke-width="1.2"/>
        <circle cx="480" cy="360" r="216" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2 9"/>
    </g>
    <ellipse cx="480" cy="360" rx="255" ry="128" stroke="#dd8297" stroke-opacity="0.28" stroke-width="1" fill="none"/>

    <!-- tower -->
    <g transform="translate(480 360)">
        <circle r="66" fill="url(#tspTowerGlow)" filter="url(#tspSoft)"/>
        <path d="M -14 90 L -22 20 L -12 20 L -12 -34 L -20 -34 L -20 -52 L -8 -52 L -8 -78 L 8 -78 L 8 -52 L 20 -52 L 20 -34 L 12 -34 L 12 20 L 22 20 L 14 90 Z" fill="url(#tspTower)" stroke="#5c4530" stroke-width="1.5"/>
        <rect x="-6" y="-96" width="12" height="20" rx="2" fill="#fff6da"/>
        <circle cy="-100" r="6" fill="#fff2d0"/>
    </g>

    <!-- orbiting orbs -->
    <g>
        <circle cx="480" cy="240" r="9" fill="url(#tspOrbPink)" stroke="#33202b" stroke-width="1.5"/>
        <circle cx="480" cy="240" r="16" fill="#dd8297" opacity="0.18"/>
    </g>
    <g>
        <circle cx="592" cy="360" r="9" fill="url(#tspOrbGreen)" stroke="#33202b" stroke-width="1.5"/>
        <circle cx="592" cy="360" r="16" fill="#71816b" opacity="0.18"/>
    </g>
    <g>
        <circle cx="480" cy="480" r="9" fill="url(#tspOrbPink)" stroke="#33202b" stroke-width="1.5"/>
        <circle cx="480" cy="480" r="16" fill="#dd8297" opacity="0.18"/>
    </g>
    <g>
        <circle cx="368" cy="360" r="9" fill="url(#tspOrbGreen)" stroke="#33202b" stroke-width="1.5"/>
        <circle cx="368" cy="360" r="16" fill="#71816b" opacity="0.18"/>
    </g>

    <!-- inner mine markers -->
    <g fill="#e8c98f" stroke="#5c4530" stroke-width="1">
        <path d="M480 300 l6 6 -6 6 -6 -6 Z"/>
        <path d="M547 393 l6 6 -6 6 -6 -6 Z"/>
        <path d="M413 393 l6 6 -6 6 -6 -6 Z"/>
    </g>

    <g opacity="0.42" filter="url(#tspSofter)" fill="#ffb9cc">
        <path d="M84 522 c10 -14 30 -14 40 0 c-10 10 -30 10 -40 0 Z"/>
        <path d="M84 522 c-4 -16 10 -30 26 -28 c-2 14 -12 26 -26 28 Z"/>
        <path d="M84 522 c-14 6 -30 -2 -32 -18 c14 -4 28 6 32 18 Z"/>
        <path d="M84 522 c16 4 24 20 16 34 c-12 -6 -20 -20 -16 -34 Z"/>
        <path d="M84 522 c14 -8 30 0 32 16 c-14 4 -28 -4 -32 -16 Z"/>
    </g>

    <rect width="960" height="600" fill="url(#tspVignette)"/>
</svg>
