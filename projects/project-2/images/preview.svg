<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="A glowing clock suspended inside a slowing time field, with three power stones orbiting it">
    <title>Chrono Field</title>
    <defs>
        <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#170f2e"/>
            <stop offset="55%" stop-color="#241a45"/>
            <stop offset="100%" stop-color="#120a22"/>
        </linearGradient>
        <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#bdf1ff" stop-opacity="0.95"/>
            <stop offset="35%" stop-color="#6fd6f2" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#6fd6f2" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="fieldGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#8f7bff" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#8f7bff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#eafcff"/>
            <stop offset="45%" stop-color="#8fd8ec"/>
            <stop offset="100%" stop-color="#7c6bd4"/>
        </linearGradient>
        <radialGradient id="face" cx="42%" cy="38%" r="70%">
            <stop offset="0%" stop-color="#2c2358"/>
            <stop offset="100%" stop-color="#160f30"/>
        </radialGradient>
        <linearGradient id="stoneCyan" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d6faff"/>
            <stop offset="100%" stop-color="#4fb8dd"/>
        </linearGradient>
        <linearGradient id="stoneViolet" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e6dcff"/>
            <stop offset="100%" stop-color="#8f6fe0"/>
        </linearGradient>
        <linearGradient id="stonePink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe3ea"/>
            <stop offset="100%" stop-color="#dd8297"/>
        </linearGradient>
        <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
            <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
        </radialGradient>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="10"/>
        </filter>
        <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
    </defs>

    <rect width="960" height="600" fill="url(#sky)"/>

    <g opacity="0.5">
        <circle cx="130" cy="120" r="1.6" fill="#eafcff"/>
        <circle cx="210" cy="70" r="1.1" fill="#eafcff"/>
        <circle cx="80" cy="260" r="1.3" fill="#eafcff"/>
        <circle cx="850" cy="90" r="1.4" fill="#eafcff"/>
        <circle cx="900" cy="180" r="1" fill="#eafcff"/>
        <circle cx="790" cy="440" r="1.3" fill="#eafcff"/>
        <circle cx="860" cy="500" r="1.6" fill="#eafcff"/>
        <circle cx="60" cy="470" r="1.2" fill="#eafcff"/>
        <circle cx="150" cy="530" r="1" fill="#eafcff"/>
    </g>

    <circle cx="480" cy="300" r="270" fill="url(#fieldGlow)"/>
    <circle cx="480" cy="300" r="200" fill="url(#coreGlow)" filter="url(#soft)"/>

    <g fill="none" stroke="#9fe0f2">
        <circle cx="480" cy="300" r="150" stroke-opacity="0.5" stroke-width="1.5"/>
        <circle cx="480" cy="300" r="196" stroke-opacity="0.32" stroke-width="1.2"/>
        <circle cx="480" cy="300" r="240" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="2 10"/>
    </g>

    <g stroke="#c8b6ff" stroke-opacity="0.4" fill="none">
        <ellipse cx="480" cy="300" rx="235" ry="118" stroke-width="1"/>
    </g>

    <g transform="translate(480 300)">
        <circle r="128" fill="url(#face)" stroke="url(#rim)" stroke-width="7"/>
        <circle r="118" fill="none" stroke="#0c0820" stroke-opacity="0.6" stroke-width="1"/>

        <g stroke="#bfe9f7" stroke-opacity="0.85">
            <line x1="0" y1="-104" x2="0" y2="-92" stroke-width="3"/>
            <line x1="0" y1="104" x2="0" y2="92" stroke-width="3"/>
            <line x1="-104" y1="0" x2="-92" y2="0" stroke-width="3"/>
            <line x1="104" y1="0" x2="92" y2="0" stroke-width="3"/>
            <line x1="73.5" y1="-73.5" x2="65" y2="-65" stroke-width="2"/>
            <line x1="-73.5" y1="-73.5" x2="-65" y2="-65" stroke-width="2"/>
            <line x1="73.5" y1="73.5" x2="65" y2="65" stroke-width="2"/>
            <line x1="-73.5" y1="73.5" x2="-65" y2="65" stroke-width="2"/>
        </g>

        <path d="M 0 0 L -58 -78 A 96 96 0 0 1 40 -88 Z" fill="#8fd8ec" opacity="0.22"/>

        <line x1="0" y1="0" x2="-52" y2="-70" stroke="#eafcff" stroke-width="6" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="70" y2="-25" stroke="#eafcff" stroke-width="8" stroke-linecap="round"/>
        <circle r="10" fill="#eafcff"/>
        <circle r="4" fill="#241a45"/>
    </g>

    <g transform="translate(480 300)">
        <g transform="rotate(-18)">
            <path transform="translate(232 -6) rotate(24)" d="M0 -17 L15 -6 L9 14 L-9 14 L-15 -6 Z" fill="url(#stoneCyan)" stroke="#eafcff" stroke-width="1"/>
        </g>
        <g transform="rotate(96)">
            <path transform="translate(210 30) rotate(-40)" d="M0 -14 L12 -5 L7 12 L-7 12 L-12 -5 Z" fill="url(#stoneViolet)" stroke="#eafcff" stroke-width="1"/>
        </g>
        <g transform="rotate(200)">
            <path transform="translate(224 14) rotate(60)" d="M0 -13 L11 -4 L7 11 L-7 11 L-11 -4 Z" fill="url(#stonePink)" stroke="#fff5f7" stroke-width="1"/>
        </g>
    </g>

    <g fill="#eafcff">
        <g transform="translate(700 150)" opacity="0.85">
            <path d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z"/>
        </g>
        <g transform="translate(255 420) scale(0.8)" opacity="0.75">
            <path d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z"/>
        </g>
        <g transform="translate(650 460) scale(0.6)" opacity="0.6">
            <path d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z"/>
        </g>
    </g>

    <g opacity="0.4" filter="url(#softer)" fill="#ffb9cc">
        <path d="M84 522 c10 -14 30 -14 40 0 c-10 10 -30 10 -40 0 Z"/>
        <path d="M84 522 c-4 -16 10 -30 26 -28 c-2 14 -12 26 -26 28 Z"/>
        <path d="M84 522 c-14 6 -30 -2 -32 -18 c14 -4 28 6 32 18 Z"/>
        <path d="M84 522 c16 4 24 20 16 34 c-12 -6 -20 -20 -16 -34 Z"/>
        <path d="M84 522 c14 -8 30 0 32 16 c-14 4 -28 -4 -32 -16 Z"/>
    </g>

    <rect width="960" height="600" fill="url(#vignette)"/>
</svg>
